<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <radialGradient id="goldDot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
  </defs>

  <!-- Pozadina sa zaobljenim kutovima -->
  <rect width="64" height="64" rx="14" fill="url(#bg1)" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Tri koncentrična kvadrata ploče -->
  <rect x="10" y="10" width="44" height="44" fill="none" stroke="#475569" stroke-width="2" rx="2" />
  <rect x="18" y="18" width="28" height="28" fill="none" stroke="#64748b" stroke-width="2" rx="1" />
  <rect x="26" y="26" width="12" height="12" fill="none" stroke="#94a3b8" stroke-width="2" />

  <!-- Vezne linije križa -->
  <line x1="32" y1="10" x2="32" y2="26" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="38" x2="32" y2="54" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="10" y1="32" x2="26" y2="32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="38" y1="32" x2="54" y2="32" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Mlin figure (formirani mlin na gornjoj liniji) -->
  <circle cx="10" cy="10" r="4.5" fill="url(#goldDot)" />
  <circle cx="32" cy="10" r="4.5" fill="url(#goldDot)" />
  <circle cx="54" cy="10" r="4.5" fill="url(#goldDot)" />
</svg>
